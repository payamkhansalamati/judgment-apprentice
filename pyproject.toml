[project]
name = "judgment-apprentice"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "pydantic-settings>=2.7", "sqlalchemy>=2.0", "langgraph>=1.0", "langgraph-checkpoint-sqlite>=3.0", "openai>=2.0", "elevenlabs>=2.0"]
[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.12"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
